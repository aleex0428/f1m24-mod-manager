name: Release

# Push a version tag and this builds, signs, and publishes everything the
# in-app updater needs:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# Requires one repository secret:
#   TAURI_SIGNING_PRIVATE_KEY — contents of the minisign private key.
# (No password secret is needed; an undefined secret resolves to an empty
# string, which is what the key was generated with.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # All three files must agree, or the updater compares the wrong versions.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ] || [ "$NPM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is $TAG_VERSION but tauri.conf.json says $APP_VERSION and package.json says $NPM_VERSION."
            echo "Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to the same version."
            exit 1
          fi

      # The committed config carries a placeholder endpoint on purpose; the
      # real one is whatever repository this workflow runs in.
      - name: Point the updater at this repository
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.plugins.updater.endpoints = [
              `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`
            ];
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
            console.log("Updater endpoint:", config.plugins.updater.endpoints[0]);
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --lib

      # 12b. The endpoint is compiled into the binary and cannot be corrected
      # afterwards: a build that ships a dead URL strands every user who
      # installs it. Verify it resolves *before* anything is published.
      - name: Verify the updater endpoint resolves
        shell: bash
        run: |
          ENDPOINT=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.endpoints[0]")
          echo "Endpoint: $ENDPOINT"

          case "$ENDPOINT" in
            *OWNER/REPO*|"") echo "::error::The updater endpoint is still a placeholder."; exit 1 ;;
          esac

          # On the very first release there is no published release yet, so a
          # 404 is only fatal from the second one onwards.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$ENDPOINT")
          echo "HTTP $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Endpoint is live."
          elif [ "$(gh release list --limit 1 | wc -l)" -eq 0 ]; then
            echo "::notice::No published release yet; the endpoint starts working with this one."
          else
            echo "::error::The updater endpoint returns $STATUS but releases already exist. Publishing now would ship an app that cannot update."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "F1M24 Mod Manager __VERSION__"
          releaseBody: |
            Download `F1M24 Mod Manager___VERSION___x64-setup.exe` below and run it.

            Windows SmartScreen will warn that the publisher is unknown because
            the installer is not code-signed: **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
          # Generates and uploads latest.json, which the app polls for updates.
          includeUpdaterJson: true

      # 12a. Second, independent copy of the manifest. The releases endpoint is
      # tried first because it is always in sync; this one is the safety net for
      # when that URL cannot be reached, and it can be edited by hand to point
      # anywhere if the project ever moves.
      - name: Publish the update manifest to GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .pages && mkdir .pages
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --dir .pages --clobber

          cd .pages
          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>F1M24 Mod Manager — update manifest</title>
          <p>This page only exists to serve <a href="latest.json">latest.json</a>,
          the fallback manifest the app reads when checking for updates.</p>
          HTML

          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.email=actions@github.com -c user.name="github-actions"               commit -q -m "Update manifest for ${GITHUB_REF_NAME}"
          git push -q --force               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # 12d. Overtake.gg only accepts archives, so ship a ready-made zip built
      # from the signed installer. Doing it here removes the failure mode of
      # zipping a stale binary from a local build folder by hand.
      - name: Package the installer for Overtake.gg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE="src-tauri/target/release/bundle/nsis"
          INSTALLER="F1M24 Mod Manager_${VERSION}_x64-setup.exe"

          if [ ! -f "$BUNDLE/$INSTALLER" ]; then
            echo "::error::Installer not found at $BUNDLE/$INSTALLER"
            exit 1
          fi

          sed "s/__VERSION__/${VERSION}/g" .github/overtake-readme.txt > "$BUNDLE/README - IMPORTANT.txt"

          cd "$BUNDLE"
          7z a -tzip "F1M24-Mod-Manager-${VERSION}-Windows.zip" "$INSTALLER" "README - IMPORTANT.txt"
          gh release upload "${GITHUB_REF_NAME}" "F1M24-Mod-Manager-${VERSION}-Windows.zip" --clobber
